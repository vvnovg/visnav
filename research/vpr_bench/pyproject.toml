[project]
name = "vpr-bench"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "requests>=2.31",
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
osm = ["osmium>=3.7"]

[project.scripts]
vpr-bench = "vpr_bench.cli:main"
vpr-m1 = "vpr_bench.m1cli:main"
vpr-m2 = "vpr_bench.m2cli:main"
vpr-m3 = "vpr_bench.m3cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpr_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: скачивает модели или ходит в сеть"]
addopts = "-m 'not slow'"
